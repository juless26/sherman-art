<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Works | Mark Sherman</title>
  <meta name="description" content="Original realistic watercolors by award-winning San Diego artist Mark Sherman. Wildlife, racehorses, lighthouses, flowers, portraits and commissions.">
  <meta property="og:title" content="Mark Sherman | Watercolor Artist">
  <meta property="og:description" content="Original realistic watercolors by award-winning San Diego artist Mark Sherman.">
  <meta property="og:image" content="images/commissions/tipping-point.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;1,8..60,300&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="site-header">
    <a class="name" href="index.html">Mark Sherman</a>
    <p class="tagline">Watercolor Paintings</p>
    <nav class="nav" aria-label="Main">
      <a href="works.html" aria-current="page">Works</a>
      <a href="commissions.html">Commissions</a>
      <a href="https://www.etsy.com/shop/MarkShermanArt" target="_blank" rel="noopener">Shop</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>

    <!-- Large page title over a faded painting, like sonyasklaroff.com -->
    <section class="page-banner" aria-label="Works">
      <img class="page-banner-img" src="images/commissions/pet-huskies.jpg" alt="">
      <h1 class="page-title">Works</h1>
    </section>

    <section id="works" class="section page">
      <div class="gallery" id="grid"></div>
    </section>

  </main>

  <footer class="site-footer">
    <p>© <span id="year"></span> Mark Sherman. All paintings are copyrighted by the artist.</p>
  </footer>

  <!-- Full-screen view of a painting. Shows the title and size; arrows move between paintings. -->
  <dialog class="viewer" id="lightbox" aria-label="Painting">
    <button class="viewer-close" id="lightbox-close" aria-label="Close">&times;</button>
    <button class="viewer-arrow viewer-prev" id="lb-prev" aria-label="Previous painting">&#8249;</button>
    <figure class="viewer-figure">
      <img id="lb-img" alt="">
      <figcaption class="viewer-caption">
        <span id="lb-title"></span><span id="lb-meta"></span>
        <a id="lb-buy" target="_blank" rel="noopener">View on Etsy</a>
      </figcaption>
    </figure>
    <button class="viewer-arrow viewer-next" id="lb-next" aria-label="Next painting">&#8250;</button>
  </dialog>


  <script src="paintings.js"></script>
  <script src="main.js"></script>
</body>
</html>
