<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Works | Mark Sherman</title>
  <meta name="description" content="Original realistic watercolors by award-winning San Diego artist Mark Sherman. Wildlife, racehorses, lighthouses, flowers, portraits and commissions.">
  <meta property="og:title" content="Mark Sherman | Watercolor Artist">
  <meta property="og:description" content="Original realistic watercolors by award-winning San Diego artist Mark Sherman.">
  <meta property="og:image" content="images/commissions/tipping-point.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;1,8..60,300&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="site-header">
    <a class="name" href="index.html">Mark Sherman</a>
    <p class="tagline">Watercolor Paintings</p>
    <nav class="nav" aria-label="Main">
      <a href="works.html" aria-current="page">Works</a>
      <a href="commissions.html">Commissions</a>
      <a href="https://www.etsy.com/shop/MarkShermanArt" target="_blank" rel="noopener">Shop</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>

    <section id="works" class="section page">
      <h2 class="section-title">Works</h2>
      <p class="section-note">Original watercolors on archival 300 lb Arches paper, double matted and framed. Click a painting to see it larger.</p>
      <div class="grid" id="grid"></div>
    </section>

  </main>

  <footer class="site-footer">
    <p>© <span id="year"></span> Mark Sherman. All paintings are copyrighted by the artist.</p>
  </footer>

  <!-- Larger view of a painting -->
  <dialog class="lightbox" id="lightbox" aria-label="Painting detail">
    <button class="lightbox-close" id="lightbox-close" aria-label="Close">×</button>
    <div class="lightbox-body">
      <img id="lb-img" alt="">
      <div class="lightbox-text">
        <h3 id="lb-title"></h3>
        <p class="meta" id="lb-meta"></p>
        <p id="lb-desc"></p>
        <a class="button" id="lb-buy" target="_blank" rel="noopener">View on Etsy</a>
      </div>
    </div>
  </dialog>


  <script src="paintings.js"></script>
  <script src="main.js"></script>
</body>
</html>
