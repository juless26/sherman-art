<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Mark Sherman</title>
  <meta name="description" content="Original realistic watercolors by award-winning San Diego artist Mark Sherman. Wildlife, racehorses, lighthouses, flowers, portraits and commissions.">
  <meta property="og:title" content="Mark Sherman | Watercolor Artist">
  <meta property="og:description" content="Original realistic watercolors by award-winning San Diego artist Mark Sherman.">
  <meta property="og:image" content="images/commissions/tipping-point.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;1,8..60,300&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="site-header">
    <a class="name" href="index.html">Mark Sherman</a>
    <p class="tagline">Realistic watercolor · San Diego</p>
    <nav class="nav" aria-label="Main">
      <a href="works.html">Works</a>
      <a href="commissions.html">Commissions</a>
      <a href="about.html">About</a>
      <a href="contact.html" aria-current="page">Contact</a>
      <a href="https://www.etsy.com/shop/MarkShermanArt" target="_blank" rel="noopener">Shop</a>
    </nav>
  </header>

  <main>

    <section id="contact" class="section page contact">
      <h2 class="section-title">Contact</h2>
      <div class="contact-cols">
        <div class="contact-info">
          <p>For commissions, questions about a painting, or a studio visit:</p>
          <p class="email"><a href="mailto:mark@shermanart.com">mark@shermanart.com</a></p>
          <p>Del Mar, California</p>
          <p><a href="https://www.etsy.com/shop/MarkShermanArt" target="_blank" rel="noopener">Buy originals on Etsy</a></p>
        </div>
        <!-- Netlify reads this form automatically when the site is deployed. Messages appear under Forms in the Netlify dashboard. -->
        <form class="contact-form" name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field">
          <input type="hidden" name="form-name" value="contact">
          <p hidden><label>Leave this empty <input name="bot-field"></label></p>
          <label for="f-name">Name</label>
          <input id="f-name" name="name" type="text" autocomplete="name" required>
          <label for="f-email">Email</label>
          <input id="f-email" name="email" type="email" autocomplete="email" required>
          <label for="f-topic">What is this about?</label>
          <select id="f-topic" name="topic">
            <option>A painting for sale</option>
            <option>Portrait commission</option>
            <option>Pet portrait commission</option>
            <option>Home or building commission</option>
            <option>Something else</option>
          </select>
          <label for="f-message">Message</label>
          <textarea id="f-message" name="message" rows="5" required></textarea>
          <button class="button" type="submit">Send</button>
        </form>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <p>© <span id="year"></span> Mark Sherman. All paintings are copyrighted by the artist.</p>
  </footer>

  <script src="main.js"></script>
</body>
</html>
